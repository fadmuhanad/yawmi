 <h1>${fd(date)}</h1>
 <div class=row><span>صحيت الساعة</span><select id=dw style="width:auto">${op(0,23,W)}</select><span>أنام الساعة</span><select id=dz style="width:auto">${op(1,24,Z)}</select></div>
 ${un.length?'<h2>مهام أمس لم تنجز</h2>'+pv.tasks.map((t,i)=>!t.x&&!t.m?`<div class=t><span style="flex:1">${esc(t.n)}</span><button data-mv=${i}>انقلها لليوم</button><button data-dp=${i} title="حذف">🗑</button></div>`:'').join(''):''}
 <h2>مهام اليوم</h2>${dd.tasks.map((t,i)=>`<div class="t ${t.x?'d':''}"><input type=checkbox style="width:auto" data-ck=${i} ${t.x?'checked':''}><span style="flex:1">${esc(t.n)}</span><button data-dt=${i} title="حذف">🗑</button></div>`).join('')}
 <input id=nt placeholder="+ مهمة جديدة (Enter)">
 <h2>جدول الساعات</h2>${hs.map(h=>{const i=dd.blocks.findIndex(b=>b.f<=h&&h<b.t),b=dd.blocks[i];return`<div class=h><b>${fmt(h)}</b>${b?`<div class=f style="background:${cc(b)};color:${ink(cc(b))}" data-eb=${i}>${S.cats[b.c]?.e||''} ${esc(b.x)}</div>`:`<div data-add=${h}>+</div>`}</div>`}).join('')}
 <h2>التصنيفات</h2>${S.cats.map((k,i)=>`<div class=row data-cat=${i} style="margin-bottom:6px"><input value="${esc(k.e||'')}" maxlength=8 style="width:56px;text-align:center"><input type=color value="${k.c}" style="width:44px;height:34px;padding:2px"><input value="${esc(k.n)}" style="flex:1"></div>`).join('')}<div class=row><button id=ac>+ تصنيف</button></div>

 const go2=n=>{date.setDate(date.getDate()+n);go()},all=s=>A.querySelectorAll(s);
 $('#pb').onclick=()=>go2(-1);$('#nb').onclick=()=>go2(1);$('#tb').onclick=()=>{date=new Date();go()};$('#wk').onclick=()=>report(date);$('#mb').onclick=()=>monthView(date);$('#so').onclick=()=>signOut(auth);
 $('#nt').onkeydown=e=>{if(e.key=='Enter'&&e.target.value.trim()){dd.tasks.push({n:e.target.value.trim(),x:0});sv();render();$('#nt').focus()}};
 all('[data-ck]').forEach(el=>el.onchange=()=>{const i=+el.dataset.ck,t=dd.tasks[i];t.x=el.checked?1:0;sv();render();if(t.x)ask(t.n,W,W+1,0,b=>{dd.blocks.push({...b,k:i});sv();render()})});

 all('[data-eb]').forEach(el=>el.onclick=()=>{if(confirm('حذف هذه الفترة؟')){dd.blocks.splice(+el.dataset.eb,1);sv();render()}});

 all('[data-dp]').forEach(el=>el.onclick=()=>{const i=+el.dataset.dp;if(confirm('حذف المهمة «'+pv.tasks[i].n+'»؟')){pv.tasks.splice(i,1);saveDay(pd,pv);render()}});

 all('[data-cat]').forEach(r=>{const i=+r.dataset.cat,[e,c,n]=r.querySelectorAll('input');e.onchange=()=>{S.cats[i].e=e.value.trim();saveS();render()};c.onchange=()=>{S.cats[i].c=c.value;saveS();render()};n.onchange=()=>{S.cats[i].n=n.value.trim()||S.cats[i].n;saveS();render()}});

const pct=ts=>ts.length?Math.round(100*ts.filter(t=>t.x).length/ts.length):null;

const BX='border:1px solid var(--bd);border-radius:10px;padding:12px;cursor:pointer;background:var(--hv)',GR='display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:16px';

 const d0=wkStart(from),ds=await Promise.all([...Array(7)].map((_,i)=>ld(addD(d0,i))));

 <h2>ساعات الأسبوع</h2><p>سجّلت ${tot} من ${all} ساعة، وغير المسجّل ${all-tot} ساعة.</p>${S.cats.map((k,i)=>`<div><span class=c style="background:${k.c}"></span>${k.e||''} ${esc(k.n)}: ${sum[i]||0} ساعة</div>`).join('')}

 $('#bk').onclick=render;$('#wp').onclick=()=>report(addD(d0,-7));$('#wn').onclick=()=>report(addD(d0,7));$('#mn').onclick=()=>monthView(addD(d0,3));

async function monthView(r0){
 A.innerHTML='<p class=box>جاري التحميل…</p>';
 const m0=new Date(r0.getFullYear(),r0.getMonth(),1),m1=new Date(r0.getFullYear(),r0.getMonth()+1,0),ws=[];

 $('#bk').onclick=render;$('#mp').onclick=()=>monthView(new Date(m0.getFullYear(),m0.getMonth()-1,1));$('#mx').onclick=()=>monthView(new Date(m0.getFullYear(),m0.getMonth()+1,1));
